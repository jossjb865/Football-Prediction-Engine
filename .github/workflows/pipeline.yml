name: Enhanced ML Pipeline

on:
  schedule:
    - cron: '0 14 * * *'  # Daily at 14:00 UTC
  workflow_dispatch:
    inputs:
      train_model:
        description: 'Retrain model?'
        required: false
        default: 'false'

jobs:
  train:
    if: github.event.inputs.train_model == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml
      
      - name: Train model
        env:
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          LIGA_MX_LEAGUE_ID: ${{ secrets.LIGA_MX_LEAGUE_ID }}
        run: |
          python main.py --min-year 2020
      
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: artifacts/models/

  predict:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: artifacts/models/
      
      - name: Generate predictions
        env:
          ISPORTS_API_KEY: ${{ secrets.ISPORTS_API_KEY }}
          LIGA_MX_LEAGUE_ID: ${{ secrets.LIGA_MX_LEAGUE_ID }}
        run: |
          python predict.py --days-ahead 7
      
      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: daily-predictions
          path: artifacts/predictions/
